[workspace]
members = [
  "crates/ald-types",
  "crates/ald-hashing",
  "crates/ald-merkle",
  "crates/ald-config",
  "crates/ald-checkpoint",
  "crates/ald-evidence",
  "crates/ald-scenario",
  "crates/ald-learners",
  "crates/ald-interventions",
  "crates/ald-verifier",
  "crates/ald-analysis",
  "crates/ald-orchestrator",
  "crates/ald-cli",
]
resolver = "2"

[workspace.package]
rust-version = "1.87"

[workspace.lints.clippy]
pedantic = "warn"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
