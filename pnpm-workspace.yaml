packages:
  - packages/*

linkWorkspacePackages: true

allowBuilds:
  better-sqlite3@12.11.1: true
  esbuild@0.28.2: true

overrides:
  source-map-js: '>=1.2.2'
  # GHSA-587h-7wmj-h5pm (high, vite <=8.3.2 via vitest): pin past the
  # advisory. Remove when upstream vitest ships a vite floor >=8.3.3.
  vite: 8.3.3
  # GHSA-mrhx-c7xc-m3w5 (high, zod <4.6.6 memory exhaustion): pin past
  # the advisory. Remove when the workspace zod floor reaches >=4.6.6.
  zod: 4.6.7
