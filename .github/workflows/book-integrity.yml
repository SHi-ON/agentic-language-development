name: Paper checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  paper-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Create independent-statistics venv
        run: |
          uv sync --frozen

      - name: Audit dependency graph
        run: |
          mkdir -p artifacts
          pnpm audit --audit-level=high --json > artifacts/pnpm-audit.json

      - name: Run paper gate with timing
        run: |
          mkdir -p artifacts
          /usr/bin/time -v pnpm run check 2> artifacts/paper-check-runtime.txt

      - name: Upload test and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-check-evidence
          path: artifacts/
          retention-days: 30

  paper-validate:
    runs-on: ubuntu-latest
    needs: paper-check
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate secrets and claim boundary
        run: pnpm run paper:validate

  worksheet-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run retained-identity worksheet tests
        run: |
          uv run --frozen python -m unittest worksheets.tests.test_retained_identity -v

  full-suite-weekly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite
        run: pnpm run test
